name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:csp
      # every shipped example's committed function, ejected and run in a fresh vitest + fast-check project (~15 s)
      - run: npm run check:eject
      # the GitHub Action's committed bundle (packages/action/dist) must be what its sources build to
      - run: npm run check:action-dist
      # the built CLI as a subprocess on its three example projects (exit codes and --json against the source snapshots)
      - run: npm run build:cli
      - run: npm run check:cli
      # what `npm publish` would ship (nothing is published; the packages stay private until docs/PACKAGES.md is settled)
      - run: npm pack --dry-run -w packages/cli -w packages/action -w packages/engine
      # every recorded candidate certified by the built CLI as a subprocess, against the site's browser measurement
      # (apps/site/src/examples/parity.browser.json; ~15 s); only the killed / killed-by-bound split may differ
      - run: npm run check:parity -w apps/site
  replay:
    # The static site must work with no backend. `npm run build` checks the shipped build compiles; `check:replay` then
    # builds the same sources in development mode (dist-check/, which carries the engine hook the shipped dist/ must not;
    # check:csp guards that), serves it with `vite preview` (replay mode, no model calls) and replays every shipped
    # recording through the engine plus the front door's own pages (gates run live in headless Chrome, which the
    # runner image provides).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:replay
